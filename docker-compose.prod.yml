version: '3.8'

services:
  lot_ai_backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: lot_ai_backend_prod
    restart: always
    ports:
      - "8000:8000"
    environment:
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-lot_sovereign_db_pass_2026}
      - POSTGRES_DB=lot_production_db
      - REDIS_URL=redis://redis:6379/0
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - LOT_AI_MODEL_PROVIDER=openai_compatible
    depends_on:
      - postgres
      - redis
      - chromadb

  postgres:
    image: postgres:15-alpine
    container_name: lot_ai_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lot_sovereign_db_pass_2026}
      POSTGRES_DB: lot_production_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: lot_ai_redis_prod
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  chromadb:
    image: chromadb/chroma:latest
    container_name: lot_ai_chromadb_prod
    restart: always
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma

volumes:
  postgres_data:
  redis_data:
  chroma_data:
